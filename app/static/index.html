<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Site Job Tracker & Model Benchmarker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js for Delta Lake Metrics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('match'); // 'match', 'jobs', 'metrics', 'ingest'
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState('tfidf');
      const [jobs, setJobs] = useState([]);
      const [metricsSummary, setMetricsSummary] = useState([]);
      const [metricsHistory, setMetricsHistory] = useState([]);
      const [loading, setLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');

      // Candidate Profile Form State
      const [candidateName, setCandidateName] = useState('Alex Morgan');
      const [candidateSkills, setCandidateSkills] = useState('Python, FastAPI, Docker, Delta Lake, REST APIs, PostgreSQL');
      const [candidateExperience, setCandidateExperience] = useState('5+ years designing scalable backend services with Python, FastAPI, and data platforms. Hands-on with PyArrow, Parquet, and Delta Lake pipelines.');
      const [preferredRoles, setPreferredRoles] = useState('Backend Engineer, Python Engineer, Data Engineer');
      const [preferredLocation, setPreferredLocation] = useState('Remote');

      // Match Results
      const [matchResults, setMatchResults] = useState(null);
      
      // Ingest URL
      const [scrapeUrl, setScrapeUrl] = useState('sample');

      // Chart ref
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Fetch initial data
      useEffect(() => {
        loadModels();
        loadJobs();
        loadMetrics();
      }, []);

      const loadModels = async () => {
        try {
          const res = await fetch('/api/v1/models');
          const data = await res.json();
          setModels(data);
          const def = data.find(m => m.is_default);
          if (def) setSelectedModel(def.model_id);
        } catch (e) {
          console.error(e);
        }
      };

      const loadJobs = async () => {
        try {
          const res = await fetch('/api/v1/jobs');
          const data = await res.json();
          setJobs(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadMetrics = async () => {
        try {
          const [sumRes, histRes] = await Promise.all([
            fetch('/api/v1/metrics/summary'),
            fetch('/api/v1/metrics/history?limit=15')
          ]);
          const sumData = await sumRes.json();
          const histData = await histRes.json();
          setMetricsSummary(sumData);
          setMetricsHistory(histData);
        } catch (e) {
          console.error(e);
        }
      };

      // Run Matching
      const handleMatch = async () => {
        setLoading(true);
        setStatusMsg('');
        try {
          const skillsArray = candidateSkills.split(',').map(s => s.trim()).filter(Boolean);
          const rolesArray = preferredRoles.split(',').map(r => r.trim()).filter(Boolean);
          
          const payload = {
            candidate: {
              candidate_id: candidateName.toLowerCase().replace(/\s+/g, '_'),
              full_name: candidateName,
              skills: skillsArray,
              experience_summary: candidateExperience,
              preferred_roles: rolesArray,
              preferred_locations: [preferredLocation]
            },
            model_name: selectedModel,
            top_k: 10
          };

          const res = await fetch('/api/v1/match', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Match failed');
          }

          const data = await res.json();
          setMatchResults(data);
          loadMetrics(); // refresh Delta metrics
        } catch (e) {
          setStatusMsg(`Error: ${e.message}`);
        } finally {
          setLoading(false);
        }
      };

      // Scrape / Ingest Jobs
      const handleScrape = async () => {
        setLoading(true);
        setStatusMsg('');
        try {
          const res = await fetch('/api/v1/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: scrapeUrl, replace_existing: false })
          });
          const data = await res.json();
          setStatusMsg(data.message);
          loadJobs();
        } catch (e) {
          setStatusMsg(`Failed to scrape: ${e.message}`);
        } finally {
          setLoading(false);
        }
      };

      // Render Metrics Chart when summary changes & tab active
      useEffect(() => {
        if (activeTab === 'metrics' && chartRef.current && metricsSummary.length > 0) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }

          const ctx = chartRef.current.getContext('2d');
          const labels = metricsSummary.map(m => m.model_name.toUpperCase());
          const latencies = metricsSummary.map(m => m.avg_latency_ms);
          const topScores = metricsSummary.map(m => m.avg_top_score * 100);

          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [
                {
                  label: 'Avg Latency (ms)',
                  data: latencies,
                  backgroundColor: 'rgba(59, 130, 246, 0.7)',
                  borderColor: 'rgb(59, 130, 246)',
                  borderWidth: 1,
                  yAxisID: 'y'
                },
                {
                  label: 'Avg Top Score (%)',
                  data: topScores,
                  backgroundColor: 'rgba(16, 185, 129, 0.7)',
                  borderColor: 'rgb(16, 185, 129)',
                  borderWidth: 1,
                  yAxisID: 'y1'
                }
              ]
            },
            options: {
              responsive: true,
              scales: {
                y: {
                  type: 'linear',
                  position: 'left',
                  title: { display: true, text: 'Latency (ms)', color: '#94a3b8' },
                  ticks: { color: '#94a3b8' },
                  grid: { color: '#1e293b' }
                },
                y1: {
                  type: 'linear',
                  position: 'right',
                  title: { display: true, text: 'Confidence (%)', color: '#94a3b8' },
                  ticks: { color: '#94a3b8' },
                  grid: { drawOnChartArea: false }
                },
                x: {
                  ticks: { color: '#94a3b8' },
                  grid: { color: '#1e293b' }
                }
              },
              plugins: {
                legend: { labels: { color: '#e2e8f0' } }
              }
            }
          });
        }
      }, [activeTab, metricsSummary]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-bold text-lg text-white">
                  JT
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Career Site Job Tracker
                    <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 font-medium">FastAPI + Delta Lake</span>
                  </h1>
                  <p className="text-xs text-slate-400">Swappable Model Engine & Real-time Delta Table Performance Metrics</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center space-x-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 text-sm">
                <button
                  onClick={() => setActiveTab('match')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition ${activeTab === 'match' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  Candidate Matcher
                </button>
                <button
                  onClick={() => setActiveTab('jobs')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition ${activeTab === 'jobs' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  Active Jobs ({jobs.length})
                </button>
                <button
                  onClick={() => { setActiveTab('metrics'); loadMetrics(); }}
                  className={`px-4 py-1.5 rounded-lg font-medium transition ${activeTab === 'metrics' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  Delta Lake Metrics
                </button>
                <button
                  onClick={() => setActiveTab('ingest')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition ${activeTab === 'ingest' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  Career Site Ingestor
                </button>
              </nav>

              <div className="flex items-center gap-2">
                <a href="/docs" target="_blank" className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                  Swagger OpenAPI ↗
                </a>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            {statusMsg && (
              <div className="mb-6 p-4 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-300 text-sm flex items-center justify-between">
                <span>{statusMsg}</span>
                <button onClick={() => setStatusMsg('')} className="text-blue-400 hover:text-white font-bold ml-4">×</button>
              </div>
            )}

            {/* TAB 1: MATCHING */}
            {activeTab === 'match' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Left Column: Candidate & Model Settings */}
                <div className="lg:col-span-5 space-y-6">
                  {/* Model Selector Card */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <div className="flex items-center justify-between mb-3">
                      <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">Swappable Matching Model</label>
                      <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Plug & Play</span>
                    </div>
                    
                    <select
                      value={selectedModel}
                      onChange={(e) => setSelectedModel(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white font-medium focus:outline-none focus:border-blue-500 text-sm"
                    >
                      {models.map(m => (
                        <option key={m.model_id} value={m.model_id}>
                          {m.name} ({m.type.toUpperCase()})
                        </option>
                      ))}
                    </select>

                    {models.find(m => m.model_id === selectedModel) && (
                      <p className="mt-3 text-xs text-slate-400 leading-relaxed bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
                        {models.find(m => m.model_id === selectedModel).description}
                      </p>
                    )}
                  </div>

                  {/* Candidate Input Card */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400">Candidate Profile</h2>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Candidate Name</label>
                      <input
                        type="text"
                        value={candidateName}
                        onChange={(e) => setCandidateName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Skills (comma-separated)</label>
                      <input
                        type="text"
                        value={candidateSkills}
                        onChange={(e) => setCandidateSkills(e.target.value)}
                        placeholder="Python, FastAPI, Docker..."
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Experience / Resume Summary</label>
                      <textarea
                        rows={4}
                        value={candidateExperience}
                        onChange={(e) => setCandidateExperience(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 resize-none leading-relaxed"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Target Roles</label>
                        <input
                          type="text"
                          value={preferredRoles}
                          onChange={(e) => setPreferredRoles(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Preferred Location</label>
                        <input
                          type="text"
                          value={preferredLocation}
                          onChange={(e) => setPreferredLocation(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                        />
                      </div>
                    </div>

                    <button
                      onClick={handleMatch}
                      disabled={loading}
                      className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-500/20 disabled:opacity-50 flex items-center justify-center gap-2"
                    >
                      {loading ? (
                        <span>Evaluating Across Career Jobs...</span>
                      ) : (
                        <span>Run Model Match & Log to Delta Lake</span>
                      )}
                    </button>
                  </div>
                </div>

                {/* Right Column: Ranked Matches */}
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-lg font-bold text-white">Ranked Job Matches</h2>
                    {matchResults && (
                      <span className="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">
                        Evaluated in <strong className="text-blue-400">{matchResults.execution_time_ms} ms</strong> via <strong className="text-indigo-400">{matchResults.model_used.toUpperCase()}</strong>
                      </span>
                    )}
                  </div>

                  {!matchResults && (
                    <div className="bg-slate-900/50 border border-dashed border-slate-800 rounded-2xl p-12 text-center">
                      <div className="text-4xl mb-3">🎯</div>
                      <h3 className="text-base font-semibold text-white mb-1">No Matches Run Yet</h3>
                      <p className="text-sm text-slate-400 max-w-sm mx-auto mb-4">
                        Select a model (TF-IDF, Keyword, or Semantic) and click "Run Model Match" to score the candidate against all career postings.
                      </p>
                      <button
                        onClick={handleMatch}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition"
                      >
                        Quick Match Demo
                      </button>
                    </div>
                  )}

                  {matchResults && matchResults.matches.length === 0 && (
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400">
                      No matching jobs found with sufficient relevance.
                    </div>
                  )}

                  {matchResults && matchResults.matches.map((match, i) => {
                    const scorePct = Math.round(match.score * 100);
                    const badgeColor = match.confidence === 'High' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                       match.confidence === 'Medium' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' :
                                       'bg-slate-500/10 text-slate-400 border-slate-500/30';

                    return (
                      <div key={match.job_id} className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 transition shadow-lg space-y-3">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-slate-500">#{i + 1}</span>
                              <h3 className="text-base font-bold text-white hover:text-blue-400 transition">{match.job_title}</h3>
                            </div>
                            <p className="text-xs text-slate-400 mt-0.5">{match.company} • {match.location}</p>
                          </div>

                          <div className="text-right">
                            <div className="text-xl font-black text-white">{scorePct}%</div>
                            <span className={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full border ${badgeColor}`}>
                              {match.confidence}
                            </span>
                          </div>
                        </div>

                        {/* Match Reasons */}
                        <div className="bg-slate-950/70 rounded-xl p-3 border border-slate-800/80 text-xs space-y-1.5">
                          <div className="text-slate-400 font-medium">Model Insights:</div>
                          {match.match_reasons.map((r, rIdx) => (
                            <div key={rIdx} className="text-slate-300 flex items-center gap-1.5">
                              <span className="text-blue-400">✓</span> {r}
                            </div>
                          ))}
                        </div>

                        {/* Matched Skills */}
                        {match.matched_skills.length > 0 && (
                          <div className="flex flex-wrap items-center gap-1.5 pt-1">
                            <span className="text-[11px] text-slate-500">Matched Skills:</span>
                            {match.matched_skills.map((skill, sIdx) => (
                              <span key={sIdx} className="text-[11px] px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium">
                                {skill}
                              </span>
                            ))}
                          </div>
                        )}

                        {match.job_url && (
                          <div className="pt-2 border-t border-slate-800/80 flex justify-end">
                            <a
                              href={match.job_url}
                              target="_blank"
                              rel="noreferrer"
                              className="text-xs text-blue-400 hover:text-blue-300 font-medium flex items-center gap-1"
                            >
                              Apply / View Posting ↗
                            </a>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: ACTIVE JOBS */}
            {activeTab === 'jobs' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-white">Active Career Site Jobs</h2>
                    <p className="text-xs text-slate-400">Currently ingested positions available for matching</p>
                  </div>
                  <button
                    onClick={loadJobs}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700"
                  >
                    Refresh Jobs
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {jobs.map(job => (
                    <div key={job.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow space-y-3">
                      <div className="flex items-start justify-between">
                        <div>
                          <h3 className="font-bold text-white text-base">{job.title}</h3>
                          <p className="text-xs text-slate-400">{job.company} • {job.location} • <span className="text-blue-400">{job.department}</span></p>
                        </div>
                        <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                          {job.employment_type}
                        </span>
                      </div>

                      <p className="text-xs text-slate-300 line-clamp-3 leading-relaxed">
                        {job.description}
                      </p>

                      {job.requirements && job.requirements.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {job.requirements.map((req, rIdx) => (
                            <span key={rIdx} className="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 rounded-md border border-slate-700">
                              {req}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: DELTA LAKE METRICS */}
            {activeTab === 'metrics' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-white">Delta Lake Performance Metrics Store</h2>
                  <p className="text-xs text-slate-400">All matching evaluations are committed as parquet/delta transactions to <code className="text-blue-400">./data/delta/model_metrics</code></p>
                </div>

                {/* Model Summary Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {metricsSummary.map(m => (
                    <div key={m.model_name} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{m.model_name}</span>
                        <span className="text-xs px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded-full border border-blue-500/20">{m.total_runs} runs</span>
                      </div>
                      <div className="text-2xl font-bold text-white">{m.avg_latency_ms} <span className="text-sm font-normal text-slate-400">ms avg</span></div>
                      <div className="text-xs text-slate-400 flex justify-between pt-2 border-t border-slate-800">
                        <span>Avg Top Score: <strong>{Math.round(m.avg_top_score * 100)}%</strong></span>
                        <span>Min/Max: {m.min_latency_ms}/{m.max_latency_ms} ms</span>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Chart */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Model Benchmark Comparison</h3>
                  <div className="h-72 w-full">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                {/* Audit Table */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Live Delta Lake Audit Log (Latest Transactions)</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="text-[11px] uppercase bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-2.5 px-3">Timestamp</th>
                          <th className="py-2.5 px-3">Model</th>
                          <th className="py-2.5 px-3">Candidate</th>
                          <th className="py-2.5 px-3">Jobs Evaluated</th>
                          <th className="py-2.5 px-3">Latency</th>
                          <th className="py-2.5 px-3">Top Match</th>
                          <th className="py-2.5 px-3">Top Score</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-mono text-[11px]">
                        {metricsHistory.map(row => (
                          <tr key={row.run_id} className="hover:bg-slate-800/40">
                            <td className="py-2 px-3 text-slate-400">{new Date(row.timestamp).toLocaleTimeString()}</td>
                            <td className="py-2 px-3 font-semibold text-indigo-400">{row.model_name}</td>
                            <td className="py-2 px-3">{row.candidate_id}</td>
                            <td className="py-2 px-3">{row.num_jobs_evaluated}</td>
                            <td className="py-2 px-3 text-blue-400">{row.latency_ms} ms</td>
                            <td className="py-2 px-3 font-sans truncate max-w-xs">{row.top_job_title || 'N/A'}</td>
                            <td className="py-2 px-3 text-emerald-400 font-bold">{Math.round(row.top_score * 100)}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: INGESTION */}
            {activeTab === 'ingest' && (
              <div className="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div>
                  <h2 className="text-lg font-bold text-white">Career Site Ingestion</h2>
                  <p className="text-xs text-slate-400">Fetch jobs directly from a company career portal, Greenhouse, Lever, or mock data</p>
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Career Site URL or Preset</label>
                  <input
                    type="text"
                    value={scrapeUrl}
                    onChange={(e) => setScrapeUrl(e.target.value)}
                    placeholder="https://api.lever.co/v0/postings/... or 'sample'"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                  <p className="text-[11px] text-slate-500 mt-1.5">Tip: Enter <code className="text-blue-400">sample</code> to re-ingest the default mock cloud engineering jobs.</p>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={handleScrape}
                    disabled={loading}
                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition disabled:opacity-50"
                  >
                    {loading ? 'Ingesting...' : 'Ingest Jobs'}
                  </button>
                  <button
                    onClick={() => { setScrapeUrl('sample'); }}
                    className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-xl border border-slate-700"
                  >
                    Reset to Preset
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-slate-900/40 text-center py-4 text-xs text-slate-500">
            FastAPI Job Tracker • Delta Lake Storage Engine • Modular AI Matcher Strategy Pattern
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
